<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTH=RCODE — You're on the list</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c0c0f;
      color: #e8e8f0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      border: 1px solid #2a2a35;
      background: #141419;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #9a9aaa; line-height: 1.5; margin: 0 0 18px; }
    a { color: #d5a6ff; }
    .newsletter {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #2a2a35;
    }
    .newsletter-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .newsletter-form input[type="email"] {
      flex: 1;
      min-width: 200px;
      background: #0f0f15;
      color: #e8e8f0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    .newsletter-form input[type="email"]:focus {
      outline: none;
      border-color: #d5a6ff;
    }
    .newsletter-form button {
      background: linear-gradient(135deg, #d5a6ff, #8fe3ff);
      color: #0c0c12;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .newsletter-form button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .status.success { color: #8fe3a0; }
    .status.error { color: #ff9d9d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You're on the list.</h1>
    <p>We'll send updates when there's something worth reading.</p>

    <div class="newsletter">
      <p>Want the studio newsletter too? Subscribe below — you'll get a confirmation email.</p>
      <form class="newsletter-form" id="newsletter-form">
        <input type="email" name="email" placeholder="your@email.com" required />
        <button type="submit" id="subscribe-btn">Subscribe</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p style="margin-top:12px;font-size:13px;color:#9a9aaa;">
        Or visit <a href="https://buttondown.com/othercode/subscribers">buttondown.com/othercode/subscribers</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('newsletter-form');
    const status = document.getElementById('status');
    const btn = document.getElementById('subscribe-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = '';
      status.className = 'status';
      btn.disabled = true;
      const email = form.email.value.trim();
      try {
        const res = await fetch('/.netlify/functions/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, tags: ['source:landing-page', 'stage:waitlist'] })
        });
        const data = await res.json();
        if (res.ok) {
          status.textContent = 'Subscribed! Check your inbox to confirm.';
          status.className = 'status success';
          form.reset();
        } else {
          status.textContent = data.detail || data.error || 'Subscription failed. Try again.';
          status.className = 'status error';
        }
      } catch {
        status.textContent = 'Network error. Try again.';
        status.className = 'status error';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
